---
name: Verify

"on":
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: classify
        name: Classify the tested merge with Git
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          classify() {
            local expected_merge actual_merge
            expected_merge="${GITHUB_SHA:-} ${BASE_SHA:-} ${HEAD_SHA:-}"
            actual_merge="$(git show -s --format='%H %P' HEAD)" || return 1
            [[ "$actual_merge" == "$expected_merge" ]] || return 1
            if git diff --quiet --no-renames HEAD^1 HEAD -- .; then
              return 1
            elif [[ $? -ne 1 ]]; then
              return 1
            fi
            git diff --quiet --no-renames HEAD^1 HEAD -- . \
              ':(exclude)docs/**' ':(exclude,glob)README.m[d]' \
              ':(exclude).codex/?*.md' ':(exclude).github/?*.md'
          }

          if classify; then
            docs_only=true
          else
            docs_only=false
          fi
          printf 'docs_only=%s\n' "$docs_only" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.classify.outputs.docs_only != 'true'

      - uses: actions/setup-node@v4
        if: steps.classify.outputs.docs_only != 'true'
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        if: steps.classify.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright headless browser
        if: steps.classify.outputs.docs_only != 'true'
        run: pnpm exec playwright install --with-deps chromium-headless-shell

      - name: >-
          Markdown lint for docs/specs/features and
          docs/requirements/use-cases
        if: steps.classify.outputs.docs_only != 'true'
        run: pnpm run lint:md

      - name: Build and test Desktop and Web hosts
        if: steps.classify.outputs.docs_only != 'true'
        run: xvfb-run -a pnpm test
